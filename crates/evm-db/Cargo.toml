[package]
name = "evm-db"
version = "0.1.0"
description = "Accesso SQLite e migrazioni versionate per l'analizzatore EVM (nessuna dipendenza da Tauri/UI)."
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
calamine = "0.36.1"
csv = "1.4"
quick-xml = "0.42"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"
